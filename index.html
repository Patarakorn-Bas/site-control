<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="คุมงานก่อสร้าง">
<meta name="theme-color" content="#0e2548">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="คุมงาน">
<meta name="robots" content="noindex, nofollow">
<title>ระบบควบคุมงานก่อสร้าง</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/THSarabunPSK-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'THSarabunPSK';src:url(fonts/THSarabunPSK-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'THSarabunPSK';src:url(fonts/THSarabunPSK-Bold.woff2) format('woff2');font-weight:600 800;font-style:normal;font-display:swap}
:root{--pri:#16366b;--pri2:#1f4f99;--navy:#0e2548;--gold:#b8912f;--ink:#1b2231;--soft:#5b6576;--line:#d8dee8;--line2:#e9edf3;--bg:#f4f6f9;--card:#fff;--chip:#eef2f8;--head:#f1f4f9;
--ok:#1b7443;--ok-bg:#e3f2e9;--warn:#8a5a00;--warn-bg:#fdf1d8;--bad:#b0271f;--bad-bg:#fbe5e3;--na:#5f6b7c;--na-bg:#edf0f4;--r:8px;--nav:62px;
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--shadow:0 1px 2px rgba(16,24,40,.05)}
:root[data-theme=dark]{--ink:#e4e8f0;--soft:#98a3b6;--line:#2b3446;--line2:#232b3b;--bg:#0e131b;--card:#161d29;--chip:#1e2736;--head:#1b2332;--pri2:#7aa7f5;--gold:#d7b25a;
--ok:#6fcf97;--ok-bg:#143022;--warn:#f2c46b;--warn-bg:#352812;--bad:#ff8a80;--bad-bg:#3a1714;--na:#98a3b6;--na-bg:#212a39}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e4e8f0;--soft:#98a3b6;--line:#2b3446;--line2:#232b3b;--bg:#0e131b;--card:#161d29;--chip:#1e2736;--head:#1b2332;--pri2:#7aa7f5;--gold:#d7b25a;
--ok:#6fcf97;--ok-bg:#143022;--warn:#f2c46b;--warn-bg:#352812;--bad:#ff8a80;--bad-bg:#3a1714;--na:#98a3b6;--na-bg:#212a39}}
*{box-sizing:border-box}html,body{font-size-adjust:none;margin:0;height:100%}
body{font-family:'THSarabunPSK','TH SarabunPSK','TH Sarabun PSK','TH Sarabun New',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:20px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.hidden{display:none!important}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:#fff;padding:6px}
svg.ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
/* header */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:calc(8px + var(--safe-t)) 14px 8px;display:flex;align-items:center;gap:10px;min-height:56px;border-bottom:3px solid var(--gold)}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer}
.top .brand img{width:32px;height:32px;border-radius:6px;border:1px solid rgba(255,255,255,.25)}
.top .brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:20.5px;letter-spacing:.1px}
.top .brand small{display:block;font-weight:400;opacity:.75;font-size:16.5px;letter-spacing:.3px}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:18px}
.tbtn:hover{background:rgba(255,255,255,.1)}
/* layout */
.shell{display:flex;min-height:calc(100% - 59px)}
nav.side{display:none}
main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:18px 16px calc(var(--nav) + 26px + var(--safe-b))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 6px;cursor:pointer;color:var(--soft);font-size:16.5px;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2px solid transparent}
nav.bottom button svg.ic{width:21px;height:21px}
nav.bottom button.on{color:var(--pri);font-weight:600;border-top-color:var(--pri)}
:root[data-theme=dark] nav.bottom button.on{color:var(--pri2);border-top-color:var(--pri2)}
@media(min-width:960px){
  nav.bottom{display:none} main{padding:22px 28px 36px}
  nav.side{display:flex;flex-direction:column;gap:2px;width:236px;flex:0 0 236px;padding:16px 10px;background:var(--card);border-right:1px solid var(--line);position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto}
  nav.side .grp{font-size:16.5px;letter-spacing:.6px;color:var(--soft);text-transform:uppercase;padding:10px 12px 4px}
  nav.side button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 12px;border-radius:6px;cursor:pointer;color:var(--ink);font-size:19px;text-align:left;border-left:3px solid transparent}
  nav.side button:hover{background:var(--chip)}
  nav.side button.on{background:var(--chip);color:var(--pri);font-weight:600;border-left-color:var(--pri)}
  :root[data-theme=dark] nav.side button.on{color:var(--pri2);border-left-color:var(--pri2)}
  nav.side .sep{border-top:1px solid var(--line);margin:10px 4px}
  nav.side .foot{margin-top:auto;font-size:16.5px;color:var(--soft);padding:10px 12px}
}
/* page header */
.phead{margin:0 0 16px}
.crumb{font-size:16.5px;color:var(--soft);margin-bottom:4px}.crumb a{color:var(--soft);text-decoration:none}.crumb a:hover{color:var(--pri2)}
.phead h1{font-size:29px;margin:0;font-weight:700;color:var(--ink);letter-spacing:-.1px}
.phead p{margin:2px 0 0;color:var(--soft);font-size:18px}
/* cards & components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card>h2,.h2{font-size:21px;margin:0 0 12px;color:var(--ink);font-weight:700;padding-left:10px;border-left:3px solid var(--gold);line-height:1.3}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.card-h h2{margin:0;font-size:21px;font-weight:700;padding-left:10px;border-left:3px solid var(--gold);line-height:1.3}
.sec-h{font-size:17px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.h3{font-size:18.5px;margin:16px 0 6px;font-weight:700;color:var(--soft)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.nowrap{white-space:nowrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card .kpis{margin-bottom:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:16.5px;color:var(--soft);font-weight:500}.kpi .v{font-size:27.5px;font-weight:700;line-height:1.25;margin-top:2px;font-variant-numeric:tabular-nums}.kpi .s{font-size:16.5px;color:var(--soft);margin-top:2px}
.ok-t{color:var(--ok)!important}.bad-t{color:var(--bad)!important}.warn-t{color:var(--warn)!important}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:16.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}.b-warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.b-bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}.b-na{background:var(--na-bg);color:var(--na);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--pri);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--pri);color:#fff;white-space:nowrap;font-size:18.5px}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.sec{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.sec:hover{background:var(--chip);filter:none}
.btn.ok{background:#1b7443;border-color:#1b7443}.btn.bad{background:#b0271f;border-color:#b0271f}.btn.acc{background:#8a5a00;border-color:#8a5a00}
.btn.sm{padding:5px 10px;font-size:17px}.btn.ghost{background:none;border-color:transparent;color:var(--pri2);padding:5px 7px}.btn.ghost:hover{background:var(--chip)}
label.f{display:block;font-size:17px;color:var(--soft);margin:10px 0 4px;font-weight:500}
.i{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--card)}
.i:focus{outline:2px solid color-mix(in srgb,var(--pri2) 45%,transparent);outline-offset:0;border-color:var(--pri2)}
textarea.i{min-height:78px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:18.5px}
th,td{border-bottom:1px solid var(--line2);padding:8px 8px;text-align:left;vertical-align:top}
th{font-size:16.5px;color:var(--soft);font-weight:600;background:var(--head)}
table.tbl{border:1px solid var(--line)}table.tbl th{border-bottom:1px solid var(--line)}table.tbl tbody tr:nth-child(even){background:color-mix(in srgb,var(--head) 55%,transparent)}
table.tbl tfoot td{font-weight:700;background:var(--head);border-top:1px solid var(--line)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.tw{overflow-x:auto}
@media(max-width:640px){.hide-m{display:none}}
.muted{color:var(--soft);font-size:17px}.empty{color:var(--soft);text-align:center;padding:28px 10px}
.bar{height:7px;background:var(--line2);border-radius:4px;position:relative;margin:8px 0 5px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--pri2)}
.bar b{position:absolute;top:-4px;width:2px;height:15px;background:var(--gold)}
.item{border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:8px;background:var(--card)}
.item .t{font-weight:600}.item .m{font-size:16.5px;color:var(--soft)}
.pgroup>summary{cursor:pointer;list-style:none;padding:10px 2px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pgroup>summary::-webkit-details-marker{display:none}
.pgroup>summary:before{content:'';width:7px;height:7px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.pgroup[open]>summary:before{transform:rotate(45deg)}
.pcard{cursor:pointer;transition:border-color .12s}.pcard:hover{border-color:var(--pri2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 10px;font-size:17px;cursor:pointer}
.chip:hover{background:var(--chip)}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--soft);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}:root[data-theme=dark] .tabs button.on{color:var(--pri2);border-bottom-color:var(--pri2)}
.chartbox{position:relative;height:300px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fcard{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.fthumb{aspect-ratio:4/3;background:var(--chip) center/cover no-repeat;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--soft)}
.fthumb svg.ic{width:34px;height:34px}
.fcap{border:0;border-top:1px solid var(--line);padding:6px 8px;font-size:16.5px;width:100%;background:var(--card)}
.fdel{border:0;background:none;color:var(--bad);cursor:pointer;float:right;padding:2px 6px;font-size:16.5px}
.drop{display:flex;gap:8px;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;color:var(--soft);cursor:pointer;margin-bottom:10px}
.drop:hover{border-color:var(--pri2);color:var(--pri2)}
.lrow{display:grid;grid-template-columns:1fr 90px 36px;gap:6px;margin-bottom:6px;align-items:center}
.xbtn{border:1px solid var(--line);background:var(--card);border-radius:6px;height:38px;cursor:pointer;color:var(--bad)}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid transparent}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}.banner.info{background:var(--card);border-color:var(--line);border-left:3px solid var(--pri2)}
/* modal, toast, lightbox */
.mbg{position:fixed;inset:0;background:rgba(10,18,32,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:32px 10px;overflow:auto}
.modal{background:var(--card);border-radius:10px;max-width:660px;width:100%;padding:18px 20px 16px;box-shadow:0 18px 50px rgba(0,0,0,.28);border-top:4px solid var(--pri)}
.modal.wide{max-width:940px}.modal h2{margin:0 0 8px;font-size:24px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px + var(--safe-b));transform:translateX(-50%);background:#1b2231;color:#fff;padding:10px 16px;border-radius:6px;z-index:80;font-size:18.5px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25);border-left:4px solid var(--gold)}
@media(min-width:960px){.toast{bottom:26px}}
.toast.err{background:#7d1c16;border-left-color:#ff8a80}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.v-ผ่าน{color:var(--ok)!important;font-weight:700}.v-ไม่ผ่าน{color:var(--bad)!important;font-weight:700}.v-ไม่พบข้อมูล{color:var(--warn)!important;font-weight:700}.v-ไม่เกี่ยวข้อง{color:var(--na)!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:7px 12px;cursor:pointer;font-size:18px;border-right:1px solid var(--line)}.seg button:last-child{border-right:0}.seg button.on{background:var(--pri);color:#fff}
/* printable documents */
.doc{background:#fff;color:#000;max-width:820px;margin:0 auto;padding:32px 38px;border:1px solid var(--line);line-height:1.35;font-size:16pt;font-family:'THSarabunPSK','TH SarabunPSK','TH Sarabun PSK','TH Sarabun New',Tahoma,sans-serif}
.doc h1{text-align:center;font-size:20pt;margin:0 0 10px}
.doc .mh{display:grid;grid-template-columns:90px 1fr;gap:2px 8px;margin-bottom:8px}
.doc .para{text-indent:2.5em;text-align:justify;margin:6px 0}
.doc h3{font-size:16pt;margin:14px 0 6px;border-bottom:1px solid #999;padding-bottom:2px}
.doc table{font-size:14pt}.doc table th{background:#eef1f6;color:#000}.doc td,.doc th{border:1px solid #bbb;padding:5px 6px}
.doc .box{border:1px solid #bbb;padding:8px;min-height:36px;white-space:pre-wrap}
.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-top:26px;font-size:16pt}
.doc .sig1{margin:26px 0 0 auto;width:300px;text-align:center}
.doc .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc figure{margin:0;border:1px solid #bbb;padding:6px;break-inside:avoid}
.doc figure img{width:100%;height:230px;object-fit:cover;display:block;background:#eee}
.doc figcaption{font-size:14pt;margin-top:4px}
.doc .pb{break-before:page}
.doc .v-ผ่าน,.doc .v-ไม่ผ่าน,.doc .v-ไม่พบข้อมูล{color:#000!important}
@media print{
  body{background:#fff}.top,nav,.noprint,.toast{display:none!important}
  main{padding:0!important;max-width:none}.doc{border:0;padding:0;max-width:none}
  @page{size:A4;margin:15mm 14mm}
}
</style>
</head>
<body>
<a class="skip" href="#main">ข้ามไปยังเนื้อหา</a>
<header class="top">
  <div class="brand" id="brand" title="หน้าหลัก"><img src="icons/icon-192.png" alt=""><span id="brandText">ระบบควบคุมงานก่อสร้าง<small>CONSTRUCTION SUPERVISION</small></span></div>
  <button class="tbtn hidden" id="syncBtn" title="ซิงก์ข้อมูล"></button>
  <button class="tbtn" id="installBtn">ติดตั้งแอป</button>
  <button class="tbtn" id="menuBtn" aria-label="เมนู">เมนู</button>
</header>
<div class="shell">
  <nav class="side" id="sideNav" aria-label="เมนูหลัก"></nav>
  <main id="main" tabindex="-1"><div class="empty"><span class="spin"></span> กำลังโหลด…</div></main>
</div>
<nav class="bottom" id="bottomNav" aria-label="เมนูหลัก"></nav>
<script>
  // ธีม: ตั้งก่อนวาดหน้าเพื่อไม่ให้กระพริบ
  try { var th = localStorage.getItem('sc_theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<script src="vendor/chart.umd.min.js" defer></script>
<script src="spec-data.js" defer></script>
<script src="vendor/jszip.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
